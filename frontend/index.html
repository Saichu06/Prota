<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Prota — Know your intake. Own your progress. Premium protein and daily nutrition tracking." />
  <meta name="theme-color" content="#0F172A" />
  <title>Prota</title>

  <!-- Typography: 5 modern font families with weights 400, 500, 600, 700 and font-display: swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script>
    // Apply saved font before first paint (keep key/ids in sync with src/lib/fonts.ts).
    try {
      var f = localStorage.getItem('prota_font');
      if (['inter', 'manrope', 'plus-jakarta', 'dm-sans', 'ibm-plex'].indexOf(f) !== -1) {
        document.documentElement.setAttribute('data-font', f);
      }
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
